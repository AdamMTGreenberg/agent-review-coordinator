name: Local Review Watchdog
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: write
concurrency:
  group: local-review-watchdog
  cancel-in-progress: false
jobs:
  recover:
    if: vars.REVIEW_CONTROL_COMMENT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Release explicitly deferred runs
        uses: AdamMTGreenberg/agent-review-coordinator@COMMIT_SHA
        with:
          mode: recover
          control-comment: ${{ vars.REVIEW_CONTROL_COMMENT }}
          github-token: ${{ github.token }}

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-review-coordinator"
version = "0.1.0"
description = "Optional local Claude/Codex review coordination with GitHub CI fallback"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-review = "agent_review_coordinator.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff==0.15.22", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
